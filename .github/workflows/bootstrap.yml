      - name: Commit canonical source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests installer scripts resources docs .gitignore LICENSE README.md Directory.Build.props BackupCron.Windows.slnx .github/workflows/windows.yml
          git commit -m "Implement Windows BackupCron with backup verification and installer"
          git push origin HEAD:main
      - name: Start Windows verification and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4; do
            if gh workflow run windows.yml --repo "$GH_REPO" --ref main -f publish=true -f version=1.0.0; then exit 0; fi
            sleep 5
          done
          exit 1
