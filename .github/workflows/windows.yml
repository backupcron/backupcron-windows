name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'installer/**'
      - 'scripts/**'
      - 'resources/**'
      - 'Directory.Build.props'
      - 'BackupCron.Windows.slnx'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer to GitHub Releases
        type: boolean
        default: false
      version:
        description: Release version
        default: '1.3.0'
        type: string
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  database-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: backupcron-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: backupcron-fixture
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install database clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 mysql-client
      - name: Core scenarios and real dump restoration
        run: dotnet run --project tests/BackupCron.Tests -c Release -- --server-tests
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select and validate release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          [xml]$properties = Get-Content Directory.Build.props
          $version = [string]$properties.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid source version.' }
          if ($env:REQUESTED_VERSION -and $env:REQUESTED_VERSION -ne $version) { throw 'Requested version differs from source version.' }
          $publish = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:REQUESTED_PUBLISH -eq 'true'
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            if ($env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Tag differs from source version.' }
            $publish = $true
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $previousText = git show HEAD^:Directory.Build.props
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read previous source version.' }
            [xml]$previous = $previousText -join "`n"
            $publish = [string]$previous.Project.PropertyGroup.Version -ne $version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build all projects
        run: dotnet build BackupCron.Windows.slnx -c Release
      - name: Backup scenarios on Windows
        run: dotnet run --project tests/BackupCron.Tests -c Release --no-build
      - name: Package self-contained installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-windows.ps1 -Version $env:RELEASE_VERSION
      - name: Verify installation and installed application
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/verify-installer.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: BackupCron-Windows
          path: |
            artifacts/*setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/proof/*
            artifacts/install.log
          if-no-files-found: warn
  release:
    needs: [windows, database-integration]
    if: needs.windows.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: BackupCron-Windows
          path: artifacts
      - name: Publish tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## Settings backup and restore

          - Automatic copies of jobs and app preferences to a chosen folder.
          - Manual backup and restore, with format validation and a local recovery copy before replacement.
          - A separate startup section and visible errors when the settings-backup destination is unavailable.
          - Updated interface text in all ten languages.

          Restoring pauses the scheduler and keeps this PC's backup folder. Check paths and passwords before enabling the scheduler. Passwords, run history and system startup registration are not transferred.

          Download the win-x64 setup.exe and run it. Requires Windows 10 version 2004 or later, or Windows 11. The .NET runtime is included; installation does not require administrator rights. The installer is currently unsigned by a publisher certificate.

          Verification: settings backup and recovery tests, backup scenarios on Windows, real PostgreSQL/MySQL dump restoration, installation and upgrade from 1.1, WPF UI smoke tests, protected credentials, local/SMB storage checks and uninstallation. The new native folder/file picker dialogs and startup after an OS login still need a manual check.
          NOTES
          printf '\nBuilt from `%s`.\n\nSHA-256:\n```text\n' "$SOURCE_COMMIT" >> release-notes.md
          cat artifacts/SHA256SUMS.txt >> release-notes.md
          printf '\n```\n' >> release-notes.md
          gh release create "v$RELEASE_VERSION" --repo "$GH_REPO" --target "$SOURCE_COMMIT" --title "BackupCron Windows $RELEASE_VERSION" --notes-file release-notes.md artifacts/*setup.exe artifacts/SHA256SUMS.txt artifacts/proof/*.png artifacts/proof/ui-result.txt
