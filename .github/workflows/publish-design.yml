name: Publish Windows 1.2 design source
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply approved source bundle
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, io, pathlib, zipfile, subprocess
          archive = base64.b64decode('')
          assert hashlib.sha256(archive).hexdigest() == '4bb0042f21f7be380dcaf41d9be36fdac75daa68788d8c6e347c6f848a9c659a'
          expected = {'README.md': '769fcdb04d4a6b06eb4c10d2078c0d421666136f414b9bd4ef6c0494e170c279', 'docs/feature-parity.md': '98639b3ff8d125c7551faf8668dafbbfb6bd6a0140db91bf181aa0976962ae87', 'src/BackupCron.Windows/JobEditorWindow.cs': '037054f613d41f7a71b0e87603872959e4537b63a82fa5ef138e5c64defcf5a0', 'src/BackupCron.Windows/MainWindow.cs': '976d2c1286fc9788d0ae0305c9543e8255fd4124e22ea2da64643655345b42e4', 'src/BackupCron.Windows/Theme.xaml': 'ac67876a243a2ee8d03a9eec336be1c13f0ca42fb3947e34ffb2cf9a78ee3ba1', 'src/BackupCron.Windows/Ui.cs': 'f1156eca0820930dab307b85c69fc771d1459f70bc303bb17921ed24bfd43c69', 'src/BackupCron.Windows/UiSmokeTests.cs': '7a3c02104221f9c7b39c612cd1d91ba30d8ef6bbbad7ea68991e59b25c8825ac'}
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert set(z.namelist()) == set(expected)
              for name in z.namelist():
                  p = pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  incoming = z.read(name)
                  existing = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
                  assert existing == expected[name] or existing == hashlib.sha256(incoming).hexdigest(), 'Changed upstream: ' + name
              for name in z.namelist():
                  p = pathlib.Path(name); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(z.read(name))
          subprocess.run(['git', 'add', *expected], check=True)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Finish macOS-style layout and installed-app visual checks [skip ci]'
            git push origin HEAD:main
          fi
      - name: Verify installed Windows application
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run windows.yml --ref main -f publish=false -f version=1.2.0
