name: Publish Windows 1.2 design source
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply approved source bundle
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, io, pathlib, zipfile, subprocess
          archive = base64.b64decode('')
          assert hashlib.sha256(archive).hexdigest() == '46f80426ad3e52975188d9803321c3779e7cbc51b33c5c7dee200dbd88e33c76'
          expected = {'resources/localizations.json': '7866ef67404c43f7649520f4100fc8cebedeea48146266e9f6d505ca10941d8a', 'src/BackupCron.Windows/UiSmokeTests.cs': '06505f5be2c8c0bd8f9cbf98f94e8ee9e3d8af8411fa7c5c034bd3e913d599e8'}
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert set(z.namelist()) == set(expected)
              for name in z.namelist():
                  p = pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  incoming = z.read(name)
                  existing = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
                  assert existing == expected[name] or existing == hashlib.sha256(incoming).hexdigest(), 'Changed upstream: ' + name
              for name in z.namelist():
                  p = pathlib.Path(name); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(z.read(name))
          subprocess.run(['git', 'add', *expected], check=True)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Release verified Windows 1.2.0 with clean gallery and translations [skip ci]'
            git push origin HEAD:main
          fi
      - name: Verify installed Windows application
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run windows.yml --ref main -f publish=true -f version=1.2.0
