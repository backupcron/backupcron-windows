name: Publish Windows 1.2 design source
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply approved source bundle
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, io, pathlib, zipfile, subprocess
          archive = base64.b64decode('')
          assert hashlib.sha256(archive).hexdigest() == '30637ed2a480fd1c34b135d39fe8e26926ab7abf97af4aa7e721122758d6e6f2'
          expected = {'src/BackupCron.Windows/MainWindow.cs': '3bc6dbd92858dc598cc67753975be986c13a02ce737a37b765eba4bfff32f049', 'src/BackupCron.Windows/Program.cs': '6e738705571ef43179bc06b268dee55ff2dc20238b8a7e8688e96a8e1d061e63', 'src/BackupCron.Windows/UiSmokeTests.cs': 'ccf51a12668b312a3d23a21161068955c14940545c222b12255d946c7b286ad5'}
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert set(z.namelist()) == set(expected)
              for name in z.namelist():
                  p = pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  incoming = z.read(name)
                  existing = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
                  assert existing == expected[name] or existing == hashlib.sha256(incoming).hexdigest(), 'Changed upstream: ' + name
              for name in z.namelist():
                  p = pathlib.Path(name); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(z.read(name))
          subprocess.run(['git', 'add', *expected], check=True)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Refine Windows navigation and verify optional SQLite sizes [skip ci]'
            git push origin HEAD:main
          fi
      - name: Verify installed Windows application
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run windows.yml --ref main -f publish=false -f version=1.2.0
