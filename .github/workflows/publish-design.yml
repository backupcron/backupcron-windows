name: Publish Windows 1.2 design source
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply approved source bundle
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, io, json, pathlib, zipfile, subprocess
          payload = ''
          archive = base64.b64decode(payload)
          assert hashlib.sha256(archive).hexdigest() == '7cc239b11ed1d7e6b4a5874b4c7daf5ec25746b23bedaef53e3d39f1e9fe9403'
          expected = {'Directory.Build.props': 'a0e702f539856a908f5425411472a5b520b2e330ff66d2f346b49112c8cd11db', 'README.md': 'c8ab8a9ff055a7c03c467b7f0a2baa757d22ee37761cb78868bb96c17a421fd2', 'docs/feature-parity.md': 'f6ab0270dcf1659aa160634423576103ac88e9d9f9bbdc4fafc4c99da3ee7651', 'installer/BackupCron.iss': 'dcc790dab16dcc72f1c247fd247bfb94bbcc9310d3abca09de37c675579e9b27', 'resources/localizations.json': '33cc015b950225c6046fe9acac9bf034783463b88298cd0391b26586749ab707', 'scripts/build-windows.ps1': '69773e72eec9499bd25a0e92b61886aae3af2a75443086438ed1c9bf4ecb4a77', 'scripts/verify-installer.ps1': '792c3a9731fc1dae70a3cd4db632660d04c588b16b9490a62820107f114ca282', 'src/BackupCron.Windows/JobEditorWindow.cs': '9d11a2ac7e726a5c162fdbd9b5aafef20c571325be7c3924dc64f9036a936991', 'src/BackupCron.Windows/MainWindow.cs': '0d1c100e89956361770c73c5fc3c32f624a95c51b5de85a696c684acf6bea20c', 'src/BackupCron.Windows/Program.cs': '6b221e3ef0fd879bb3e934c744875c5d0de2acad73ec50804b055e7fb4199c99', 'src/BackupCron.Windows/SettingsWindow.cs': '95c4ec08985841a35077bf74edf31e58f84c5b29297318e1e037cb552a3d0529', 'src/BackupCron.Windows/Ui.cs': '347cd548294bcd628605a1daf6db7a9ab404880b397c1705447ab8b629a9755f', 'src/BackupCron.Windows/Theme.xaml': None, 'src/BackupCron.Windows/UiSmokeTests.cs': None}
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert set(z.namelist()) == set(expected)
              for name in z.namelist():
                  p = pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  existing = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
                  incoming = z.read(name)
                  assert existing == expected[name] or existing == hashlib.sha256(incoming).hexdigest(), 'Changed upstream: ' + name
              for name in z.namelist():
                  p = pathlib.Path(name); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(z.read(name))
          subprocess.run(['git', 'add', *expected], check=True)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Bring Windows interface in line with macOS for 1.2.0 [skip ci]'
            git push origin HEAD:main
          fi
      - name: Verify installed Windows application
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run windows.yml --ref main -f publish=false -f version=1.2.0
