      - name: Commit storage monitoring and warnings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props README.md docs/feature-parity.md installer/BackupCron.iss resources/localizations.json scripts/build-windows.ps1 scripts/verify-installer.ps1 src/BackupCron.Core/BackupEngine.cs src/BackupCron.Core/BackupFiles.cs src/BackupCron.Core/BackupStore.cs src/BackupCron.Core/Models.cs src/BackupCron.Core/StorageMonitor.cs src/BackupCron.Windows/JobEditorWindow.cs src/BackupCron.Windows/MainWindow.cs src/BackupCron.Windows/PlatformServices.cs src/BackupCron.Windows/Program.cs src/BackupCron.Windows/SettingsWindow.cs src/BackupCron.Windows/StorageProbe.cs tests/BackupCron.Tests/Program.cs tests/BackupCron.Tests/StorageTests.cs
          git diff --cached --quiet || git commit -m "Add storage capacity, next-backup budgets and early warnings"
          git push origin HEAD:main
      - name: Start Windows verification and installer release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run windows.yml --repo "$GH_REPO" --ref main -f publish=true -f version=1.1.0
